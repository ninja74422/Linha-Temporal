<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linha do tempo de anotações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <h1>Linha do tempo</h1>

    <form id="form">
      <label for="text">Nova anotação</label>
      <textarea id="text" rows="3" required placeholder="O que aconteceu agora?"></textarea>
      <button type="submit">Salvar anotação</button>
    </form>

    <div class="filters" role="group" aria-label="Filtrar por período">
      <label>Ano <select id="f-year"></select></label>
      <label>Mês <select id="f-month"></select></label>
      <label>Dia <select id="f-day"></select></label>
      <button type="button" id="f-clear" class="link">Limpar filtros</button>
      <p id="count" aria-live="polite"></p>
    </div>
  </header>

  <main>
    <ol id="timeline" class="timeline" tabindex="0" aria-label="Anotações em ordem cronológica"></ol>
  </main>

  <script src="app.js"></script>
  <script src="effects.js"></script>
</body>
</html>
